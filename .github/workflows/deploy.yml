name: CD (Deploy to Oracle Server)

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Deploy files to production directory
      run: |
        rsync -av --delete \
          --exclude='node_modules' \
          --exclude='.git' \
          ./ /home/ubuntu/huerta-hogarea/

    - name: Install production dependencies and restart via PM2
      run: |
        cd /home/ubuntu/huerta-hogarea
        npm install --omit=dev
        pm2 restart huerta-app || pm2 start server.js --name huerta-app
