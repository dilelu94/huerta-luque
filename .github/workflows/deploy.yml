name: CI/CD Pipeline (Test & Deploy to Oracle Cloud)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Ejecución de tests obligatorios
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated test suite
        run: npm test

  # 2. Despliegue automático a OCI (solo tras pasar los tests y en pushes a main/master)
  deploy:
    name: Deploy to OCI (huertaluque)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to OCI (/home/ubuntu/huertaluque)
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            ./ ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/home/ubuntu/huertaluque/

      - name: Install production dependencies & Restart PM2
        run: |
          ssh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} << 'EOF'
            set -e
            cd /home/ubuntu/huertaluque
            npm install --omit=dev
            pm2 restart huertaluque || pm2 start server.js --name huertaluque --env production
            pm2 save
          EOF
