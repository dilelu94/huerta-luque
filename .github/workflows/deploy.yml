name: CD (Deploy to Oracle Server)

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Deploy files to production directory
      run: |
        rsync -av --delete \
          --exclude='node_modules' \
          --exclude='.git' \
          ./ /home/ubuntu/huerta-hogarea/

    - name: Install production dependencies and restart via PM2
      run: |
        cd /home/ubuntu/huerta-hogarea
        npm install --omit=dev
        pm2 restart huerta-app || pm2 start server.js --name huerta-app --env production
        pm2 save

    - name: Configure Nginx location block for /plantines
      run: |
        sudo tee /etc/nginx/snippets/plantines.conf > /dev/null << 'EOF'
        location /plantines/ {
            proxy_pass http://localhost:8085/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
        EOF
        # Incluir el snippet en el config de granjaluque si no está ya incluido
        if ! grep -q 'plantines.conf' /etc/nginx/sites-available/granjaluque.duckdns.org 2>/dev/null; then
          sudo sed -i '/server_name granjaluque.duckdns.org/a\\n    include /etc/nginx/snippets/plantines.conf;' /etc/nginx/sites-available/granjaluque.duckdns.org
        fi
        sudo nginx -t && sudo systemctl reload nginx
